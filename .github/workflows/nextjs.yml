# Сборка и публикация сайта на GitHub Pages.
# Settings → Pages → Source должен быть «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Без static_site_generator: конфиг Next.js настроен вручную.
      # Действие отдаёт base_path и base_url — они верны и для github.io, и для своего домена.
      - id: pages
        uses: actions/configure-pages@v5

      # Публиковать сайт должен только этот workflow. Если в Settings → Pages → Source
      # остался «Deploy from a branch», GitHub при каждом пуше параллельно собирает
      # README (запуск «pages build and deployment»), и сайт 1–2 минуты показывает его.
      # Шаг ничего не ломает: только предупреждает на странице запуска.
      - name: Check Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r '.build_type // empty' || true)
          echo "Источник GitHub Pages: ${type:-не удалось узнать}"
          if [ "$type" = "legacy" ]; then
            msg="Settings → Pages → Source стоит «Deploy from a branch». Переключите на «GitHub Actions», иначе при каждом обновлении сайт 1–2 минуты показывает README."
            echo "::warning title=Неверный источник GitHub Pages::$msg"
            { echo "### Неверный источник GitHub Pages"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Куда админка публикует правки и фото
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Verify static output
        run: npm run verify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
